  <text x="600" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="white">app-saved</text>
  <text x="600" y="338" text-anchor="middle" font-size="10" fill="#ddd">:3004</text>
  <text x="600" y="355" text-anchor="middle" font-size="10" fill="#ccc">Likes / Guardados</text>
  <text x="600" y="370" text-anchor="middle" font-size="10" fill="#ccc">Recomendaciones</text>
  <text x="600" y="385" text-anchor="middle" font-size="10" fill="#ccc">Redis similarity</text>

