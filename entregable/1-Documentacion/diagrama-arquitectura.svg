  <line x1="600" y1="500" x2="600" y2="560" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="500" x2="950" y2="560" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

