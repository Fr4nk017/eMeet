  <text x="95" y="338" text-anchor="middle" font-size="10" fill="#ddd">:3001</text>
  <text x="95" y="355" text-anchor="middle" font-size="10" fill="#ccc">Login / Register</text>
  <text x="95" y="370" text-anchor="middle" font-size="10" fill="#ccc">Session / OAuth</text>
  <text x="95" y="385" text-anchor="middle" font-size="10" fill="#ccc">Logout</text>

