  <text x="340" y="622" text-anchor="middle" font-size="10" fill="#86efac">profiles</text>
  <rect x="420" y="606" width="150" height="24" rx="4" fill="#27574430"/>
  <text x="495" y="622" text-anchor="middle" font-size="10" fill="#86efac">locatario_events</text>
  <rect x="270" y="636" width="140" height="24" rx="4" fill="#27574430"/>
  <text x="340" y="652" text-anchor="middle" font-size="10" fill="#86efac">user_events</text>
  <rect x="420" y="636" width="150" height="24" rx="4" fill="#27574430"/>
  <text x="495" y="652" text-anchor="middle" font-size="10" fill="#86efac">chat_rooms</text>
  <rect x="270" y="666" width="140" height="24" rx="4" fill="#27574430"/>
  <text x="340" y="682" text-anchor="middle" font-size="10" fill="#86efac">room_members</text>
  <rect x="420" y="666" width="150" height="24" rx="4" fill="#27574430"/>
