  <text x="600" y="220" text-anchor="middle" font-size="11" fill="#7ec8e3">Swipe feed · Auth · Chat · Perfil · Guardados · Mapa</text>

  <!-- Arrow frontend → microservices (vertical line down) -->
  <line x1="600" y1="228" x2="600" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Spread lines to 7 services -->
  <line x1="95" y1="270" x2="1105" y2="270" stroke="#555" stroke-width="1.5"/>
  <!-- Vertical drops -->
  <line x1="95" y1="270" x2="95" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="270" x2="245" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="415" y1="270" x2="415" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="600" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="270" x2="760" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="920" y1="270" x2="920" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1105" y1="270" x2="1105" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

