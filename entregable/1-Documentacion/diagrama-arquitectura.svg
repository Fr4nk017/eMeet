  <text x="245" y="338" text-anchor="middle" font-size="10" fill="#ddd">:3002</text>
  <text x="245" y="355" text-anchor="middle" font-size="10" fill="#ccc">Perfil de usuario</text>
  <text x="245" y="370" text-anchor="middle" font-size="10" fill="#ccc">Bio / Intereses</text>
  <text x="245" y="385" text-anchor="middle" font-size="10" fill="#ccc">Avatar (Storage)</text>

