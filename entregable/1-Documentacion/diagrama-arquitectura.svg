<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Arquitectura de Microservicios — eMeet</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#666">Monorepo Turborepo · Next.js 14 + Express + Supabase + Redis</text>

  <!-- ═══════════════════ CLIENTE ═══════════════════ -->
  <rect x="490" y="82" width="220" height="52" rx="10" fill="#0f3460" filter="url(#shadow)"/>
  <text x="600" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Navegador / Cliente</text>
  <text x="600" y="124" text-anchor="middle" font-size="11" fill="#aec6f0">HTTPS · PWA</text>

  <!-- Arrow client → frontend -->
  <line x1="600" y1="134" x2="600" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ FRONTEND ═══════════════════ -->
  <rect x="390" y="162" width="420" height="66" rx="10" fill="#16213e" filter="url(#shadow)"/>
