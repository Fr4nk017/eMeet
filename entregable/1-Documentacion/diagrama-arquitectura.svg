  <text x="600" y="493" text-anchor="middle" font-size="10" fill="#aaa">Tipos compartidos · JWT verify</text>

  <rect x="800" y="440" width="300" height="60" rx="8" fill="#2d3748" filter="url(#shadow)"/>
  <text x="950" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="white">@emeet/redis</text>
