  <text x="415" y="338" text-anchor="middle" font-size="10" fill="#ddd">:3003</text>
  <text x="415" y="355" text-anchor="middle" font-size="10" fill="#ccc">Crear / editar eventos</text>
  <text x="415" y="370" text-anchor="middle" font-size="10" fill="#ccc">Listar públicos</text>
  <text x="415" y="385" text-anchor="middle" font-size="10" fill="#ccc">Cleanup (cron)</text>

